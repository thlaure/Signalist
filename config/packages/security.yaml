security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        oauth_callback:
            pattern: ^/api/v1/connections/(raindrop|linkedin|x|bluesky)/callback$
            stateless: true
            security: false
        billing_webhook:
            pattern: ^/api/v1/billing/webhook$
            stateless: true
            security: false
        waitlist:
            pattern: ^/api/v1/waitlist(?:/|$)
            stateless: true
            security: false
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            security: false
        register:
            pattern: ^/api/v1/auth/register$
            stateless: true
            security: false
        verify_email:
            pattern: ^/api/v1/auth/verify-email$
            stateless: true
            security: false
        resend_verification:
            pattern: ^/api/v1/auth/resend-verification$
            stateless: true
            security: false
        api_docs:
            pattern: ^/api/v1/docs
            stateless: true
            security: false
        api:
            pattern: ^/(api/|mcp(?:/|$))
            stateless: true
            provider: app_user_provider
            user_checker: App\Infrastructure\Auth\ActiveUserChecker
            jwt: ~

    access_control:
        - { path: ^/api/v1/connections/(raindrop|linkedin|x|bluesky)/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/billing/webhook$, roles: PUBLIC_ACCESS }
        - { path: ^/mcp(?:/|$), roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/waitlist(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/resend-verification$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
